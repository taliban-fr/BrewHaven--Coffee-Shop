<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrewHaven Admin Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    :root { --dark:#2a1a16; --panel:#3E2723; --medium:#6f4e37; --accent:#D2B48C; --cream:#F5F5DC; --gold:#D4AF37; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: Montserrat, sans-serif; background: var(--dark); color: var(--cream); display: flex; min-height: 100vh; }
    .side { width: 200px; background: #1c110e; padding: 24px 14px; display: flex; flex-direction: column;
      gap: 6px; position: sticky; top: 0; height: 100vh; flex: 0 0 auto; }
    .side h2 { color: var(--gold); font-size: 20px; margin: 0 8px 18px; }
    .side button, .side a { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: none;
      border-radius: 8px; background: none; color: var(--cream); font: inherit; font-size: 14px;
      cursor: pointer; text-decoration: none; text-align: left; }
    .side button:hover, .side a:hover { background: rgba(255,255,255,.08); }
    .side button.active { background: var(--gold); color: #000; font-weight: 700; }
    .spacer { flex: 1; }
    main { flex: 1; padding: 24px; overflow-x: auto; min-width: 0; }
    h1 { color: var(--gold); margin-bottom: 22px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .stat { background: var(--panel); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 8px; }
    .stat span { font-size: 13px; opacity: .8; }
    .stat strong { font-size: 28px; color: var(--gold); }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px; text-align: left; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,.1); vertical-align: top; }
    th { color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    td small { opacity: .75; word-break: break-all; }
    small { opacity: .75; }
    select, input, textarea { padding: 10px 12px; border: none; border-radius: 8px; background: var(--cream);
      font: inherit; font-size: 14px; color: #222; outline: none; }
    .toolbar { margin-bottom: 16px; }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; background: var(--gold); color: #000;
      font: inherit; font-weight: 700; cursor: pointer; }
    .btn.ghost { background: none; border: 1px solid var(--gold); color: var(--gold); }
    .btn.small { padding: 6px 12px; font-size: 13px; }
    .thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; }
    .pform { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
      background: var(--panel); padding: 20px; border-radius: 14px; margin-bottom: 24px; }
    .pform textarea, .pform-actions { grid-column: 1 / -1; }
    .pform-actions { display: flex; gap: 10px; }
    .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .msg-card { background: var(--panel); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .msg-card p { margin-top: 8px; line-height: 1.5; }
    .status-select.status-pending { background: #ffe9a8; }
    .status-select.status-preparing { background: #cfe3ff; }
    .status-select.status-ready { background: #cdeccd; }
    .status-select.status-completed { background: #ddd; }
    .status-select.status-cancelled { background: #f3c4c4; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--gold);
      color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 600; z-index: 99; }
    @media (max-width: 800px) {
      body { flex-direction: column; }
      .side { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; }
      .side h2 { width: 100%; margin-bottom: 6px; }
      .spacer { display: none; }
      main { padding: 18px; }
    }
  </style>
</head>
<body>
  <aside class="side">
    <h2>BrewHaven Admin</h2>
    <button data-view="overview" class="active"><i class="bi bi-speedometer2"></i> Overview</button>
    <button data-view="orders"><i class="bi bi-receipt"></i> Orders</button>
    <button data-view="products"><i class="bi bi-cup-hot"></i> Products</button>
    <button data-view="messages"><i class="bi bi-envelope"></i> Messages</button>
    <button data-view="users"><i class="bi bi-people"></i> Users</button>
    <div class="spacer"></div>
    <a href="index.html"><i class="bi bi-shop"></i> Back to shop</a>
    <button id="logout"><i class="bi bi-box-arrow-left"></i> Logout</button>
  </aside>

  <main>
    <section class="view" id="view-overview">
      <h1>Overview</h1>
      <div class="stats" id="stats"></div>
    </section>

    <section class="view" id="view-orders" hidden>
      <h1>Orders</h1>
      <div class="toolbar">
        <select id="order-filter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="preparing">Preparing</option>
          <option value="ready">Ready</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <table>
        <thead><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Placed</th><th>Status</th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table>
    </section>

    <section class="view" id="view-products" hidden>
      <h1>Products</h1>
      <form id="product-form" class="pform">
        <input type="hidden" id="pf-id">
        <input id="pf-name" placeholder="Name" required>
        <input id="pf-price" type="number" step="0.01" min="0.01" placeholder="Price (KSh)" required>
        <input id="pf-image" placeholder="Image file, e.g. 1.jpeg" required>
        <input id="pf-tag" placeholder="Tag (optional), e.g. NEW" maxlength="20">
        <input id="pf-rating" type="number" step="0.5" min="0" max="5" value="5" placeholder="Rating 0-5">
        <label class="chk"><input id="pf-active" type="checkbox" checked> Visible in shop</label>
        <textarea id="pf-desc" rows="2" minlength="5" placeholder="Description" required></textarea>
        <div class="pform-actions">
          <button type="submit" class="btn">Save product</button>
          <button type="button" class="btn ghost" id="pf-clear">Clear</button>
        </div>
      </form>
      <table>
        <thead><tr><th></th><th>Name</th><th>Price</th><th>Status</th><th></th></tr></thead>
        <tbody id="products-body"></tbody>
      </table>
    </section>

    <section class="view" id="view-messages" hidden>
      <h1>Messages</h1>
      <div id="messages-list"></div>
    </section>

    <section class="view" id="view-users" hidden>
      <h1>Users</h1>
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Joined</th></tr></thead>
        <tbody id="users-body"></tbody>
      </table>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
